
name: Toilet WhatsApp Reminder

on:
  schedule:
    # 08.47 WIB
    - cron: "47 1 * * *"
    # 15.47 WIB
    - cron: "47 8 * * *"
    # 16.17 WIB
    - cron: "17 9 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih proses yang ingin dijalankan"
        required: true
        type: choice
        options:
          - morning
          - evening
          - report

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reminder dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/reminder-deps" --no-save --ignore-scripts firebase-admin axios

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > backend/firebase-service-account.json


 

      - name: Run WhatsApp reminder
        working-directory: backend
        env:
          NODE_PATH: ${{ runner.temp }}/reminder-deps/node_modules
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          PETUGAS_NUMBERS: ${{ secrets.PETUGAS_NUMBERS }}
          SPV_NUMBERS: ${{ secrets.SPV_NUMBERS }}
          MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}

        run: |
          echo "Jadwal yang diterima: $SCHEDULE"
          echo "Mode manual: $MODE"

          if [ "$SCHEDULE" = "47 1 * * *" ]; then
            MODE="morning"
          elif [ "$SCHEDULE" = "47 8 * * *" ]; then
            MODE="evening"
          elif [ "$SCHEDULE" = "17 9 * * *" ]; then
            MODE="report"
          fi

          echo "Menjalankan mode: $MODE"
          node ../scripts/run-reminder.js "$MODE"

      - name: Remove temporary Firebase credentials
        if: always()
        run: rm -f backend/firebase-service-account.json
